<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Maze Attendance System</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img
        src="logo.png"
        alt="Logo"
        class="logo">

        <h1>

            Maze Attendance System

        </h1>

        <p class="subtitle">

            Employee Login

        </p>

        <div class="input-group">

            <label>

                Employee ID

            </label>

            <input

                type="text"

                id="employeeId"

                placeholder="Enter Employee ID"

                autocomplete="username"

            >

        </div>

        <div class="input-group">

            <label>

                Password

            </label>

            <input

                type="password"

                id="password"

                placeholder="Enter Password"

                autocomplete="current-password"

            >

        </div>

        <button

            id="loginBtn"

            onclick="login()"

        >

            Login

        </button>

        <div

            id="status"

            class="status"

        ></div>

        <div class="version">

            Version 3.0

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
