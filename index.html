<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Maze Attendance System</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <img
        src="logo.png"
        class="logo"
        alt="Logo">

        <h1>

            Maze Attendance System

        </h1>

        <p class="subtitle">

            Employee Login

        </p>

        <div class="form-group">

            <label>

                Employee ID

            </label>

            <input

                id="employeeId"

                type="text"

                placeholder="Employee ID"

                autocomplete="username"

            >

        </div>

        <div class="form-group">

            <label>

                Password

            </label>

            <input

                id="password"

                type="password"

                placeholder="Password"

                autocomplete="current-password"

            >

        </div>

        <button
        id="loginBtn">

            Login

        </button>

        <div
        id="message"
        class="message">

        </div>

        <div class="version">

            Version 4.0

        </div>

    </div>

</div>

<script src="config.js"></script>

<script src="login.js"></script>

</body>

</html>
