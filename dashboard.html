<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <header class="topbar">

        <div>

            <h2 id="employeeName">
                Loading...
            </h2>

            <p id="employeeInfo">
                Loading...
            </p>

        </div>

        <button
        id="logoutBtn">
            Logout
        </button>

    </header>

    <section class="clock">

        <h3 id="todayDate"></h3>

        <h1 id="currentTime"></h1>

    </section>

    <section class="action-buttons">

        <button
        id="checkInBtn">

            Check In

        </button>

        <button
        id="checkOutBtn">

            Check Out

        </button>

    </section>

    <section class="cards">

        <div class="card">
            <h4>Present</h4>
            <h2 id="present">0</h2>
        </div>

        <div class="card">
            <h4>Absent</h4>
            <h2 id="absent">0</h2>
        </div>

        <div class="card">
            <h4>Leave</h4>
            <h2 id="leave">0</h2>
        </div>

        <div class="card">
            <h4>Late</h4>
            <h2 id="late">0</h2>
        </div>

        <div class="card">
            <h4>Attendance</h4>
            <h2 id="attendance">0%</h2>
        </div>

    </section>

    <section class="history">

        <h3>

            Recent Attendance

        </h3>

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Login</th>

                    <th>Logout</th>

                    <th>Hours</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="historyBody">

            </tbody>

        </table>

    </section>

</div>

<script src="config.js"></script>

<script src="dashboard.js"></script>

</body>

</html>
